<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Meu Site</title>
    <style>
        :root {
            --cor1: #ffffff;
            --cor2: #e3f2fd;
            --cor3: #fce4ec;
            --cor4: #f3e5f5;
            --texto: #333333;
            --titulo: #111111;
            --particula: #b388ff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --cor1: #121212;
                --cor2: #1a1a2e;
                --cor3: #16213e;
                --cor4: #0f3460;
                --texto: #dddddd;
                --titulo: #ffffff;
                --particula: #ffffff;
            }
        }

        body {
            font-family: -apple-system, sans-serif;
            color: var(--texto);
            text-align: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(-45deg, var(--cor1), var(--cor2), var(--cor3), var(--cor4));
            background-size: 400% 400%;
            animation: mover 15s ease infinite;
        }

        @keyframes mover {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .particulas {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .particulas span {
            position: absolute;
            bottom: -10px;
            border-radius: 50%;
            background: var(--particula);
            box-shadow: 0 0 6px var(--particula), 0 0 12px var(--particula);
            animation-name: flutuar, piscar;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: infinite, infinite;
        }

        @keyframes flutuar {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(var(--x), -27vh); }
            50%  { transform: translate(0, -55vh); }
            75%  { transform: translate(calc(var(--x) * -1), -82vh); }
            100% { transform: translate(0, -110vh); }
        }

        @keyframes piscar {
            0%, 100% { opacity: 0.2; }
            50%      { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before { animation: none; }
            .particulas { display: none; }
        }

        img {
            max-width: 90%;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        h1 { color: var(--titulo); margin-bottom: 8px; }

        p { margin-bottom: 32px; }

        .btn-jogos {
            display: inline-block;
            padding: 16px 48px;
            background: linear-gradient(135deg, #7c4dff, #00e5ff);
            color: #fff;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 50px;
            box-shadow: 0 6px 24px rgba(124, 77, 255, 0.45);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-jogos:active {
            transform: scale(0.96);
            box-shadow: 0 3px 12px rgba(124, 77, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="particulas"></div>

    <h1>Olá, eu sou Marcos</h1>
    <img src="foto.png" alt="Minha foto">
    <p>Bem-vindo ao meu primeiro site!</p>

    <a href="jogos.html" class="btn-jogos">Jogos</a>

    <script>
        const container = document.querySelector('.particulas');
        const quantidade = 40;

        for (let i = 0; i < quantidade; i++) {
            const p = document.createElement('span');
            const tamanho = Math.random() * 4 + 2;
            const subida = Math.random() * 15 + 10;
            const pisca = Math.random() * 2.5 + 1.5;

            p.style.width = tamanho + 'px';
            p.style.height = tamanho + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.setProperty('--x', (Math.random() * 80 - 40) + 'px');
            p.style.animationDuration = subida + 's, ' + pisca + 's';
            p.style.animationDelay = '-' + (Math.random() * subida) + 's, -' + (Math.random() * pisca) + 's';

            container.appendChild(p);
        }
    </script>
</body>
</html>
