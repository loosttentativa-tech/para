<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Meu Site</title>
    <style>
        /* Cores do modo CLARO (padrão) */
        :root {
            --fundo: #ffffff;
            --texto: #333333;
            --titulo: #111111;
        }

        /* Cores do modo ESCURO */
        @media (prefers-color-scheme: dark) {
            :root {
                --fundo: #121212;
                --texto: #dddddd;
                --titulo: #ffffff;
            }
        }

        body {
            font-family: -apple-system, sans-serif;
            background: var(--fundo);
            color: var(--texto);
            text-align: center;
            padding: 20px;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        img {
            max-width: 90%;
            border-radius: 12px;
            margin: 20px 0;
        }
        h1 { color: var(--titulo); }
    </style>
</head>
<body>
    <h1>Olá, eu sou [Marcos]</h1>
    <img src="foto.jpg" alt="Minha foto">
    <p>Bem-vindo ao meu primeiro site!</p>
</body>
</html>
