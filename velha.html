<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>Jogo da Velha</title>
    <style>
        :root {
            --bg1:#f5f5f5; --bg2:#e3f2fd; --texto:#333; --titulo:#111;
            --cel:#fff; --card:#fff; --borda:#ddd; --ativo:#7c4dff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg1:#121212; --bg2:#1a1a2e; --texto:#ddd; --titulo:#fff;
                --cel:#1e1e32; --card:#1e1e32; --borda:#333; --ativo:#b388ff;
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, sans-serif;
            margin: 0; min-height: 100vh;
            background: linear-gradient(160deg, var(--bg1), var(--bg2));
            color: var(--texto); text-align: center;
            padding: 16px 14px 32px;
        }
        h1 { color: var(--titulo); font-size: 1.45rem; margin: 4px 0 10px; }
        .placar {
            font-size: 1.15rem; font-weight: 700; color: var(--titulo);
            margin-bottom: 14px;
        }
        .placar span { opacity: .7; font-weight: 500; }
        .niveis {
            display: flex; gap: 8px; justify-content: center;
            margin-bottom: 14px; flex-wrap: wrap;
        }
        .niveis button {
            padding: 8px 14px; border: 2px solid var(--borda);
            background: var(--card); color: var(--texto);
            border-radius: 50px; font-weight: 700; font-size: .85rem;
        }
        .niveis button.sel {
            border-color: var(--ativo); color: var(--ativo);
            background: color-mix(in srgb, var(--ativo) 15%, transparent);
        }
        #status { min-height: 26px; margin-bottom: 14px; font-weight: 600; }
        .board {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 8px; max-width: 320px; margin: 0 auto 18px;
        }
        .cell {
            aspect-ratio: 1; background: var(--cel); border: none;
            border-radius: 14px; font-size: 2.5rem; font-weight: 800;
